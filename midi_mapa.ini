# ============================================================================
#  Bufotes VideoFX - Que notas MIDI lanzan cada evento
# ============================================================================
#
#  Formato:   evento = nota, nota, nota...
#
#  - Nota sin octava (Do, Re#, Sib  o  C, D#, Bb): cualquier octava.
#  - Nota con octava (Do2, C2): solo esa tecla.  C3 = nota 60 (Ableton, Cubase).
#  - Numero de nota MIDI (0-127): solo esa tecla.
#  - Si una tecla encaja en varias, gana la mas concreta:
#    numero > nota con octava > nota sin octava.
#    Ejemplo: "Do" lanza el cerdo en todas las octavas, pero si ademas pones
#    "Do2" en otro evento, el Do de la octava 2 lanza ese otro.
#  - Las notas que no salen en ninguna linea no hacen nada.
#  - "evento = nada" (o borrar la linea): ese evento no se lanza desde MIDI,
#    aunque puede seguir saliendo al azar.
#  - Las lineas que empiezan por # son comentarios.
#
#  Los eventos que "asoman" (cerdo_asoma, rana_guapa, muchedumbre, asnos,
#  bombilla, cabra) se quedan en pantalla mientras dure la nota. La fuerza de
#  la nota (velocity) cambia su tamano o intensidad.
#
#  Si escribes un evento que no existe, al renderizar sale un aviso con la
#  lista de nombres validos.
# ============================================================================

grillo       = Si2
motocultor   = Mi2
cabra        = Sol2

# --- Los que asoman ---
cerdo_asoma  = Fa2
rana_guapa   = La#2
muchedumbre  = Re2, Re#2
asnos        = La2, Sol#2
bombilla     = Fa#4

# --- Las ranas ---
pedo         = Do2, Do#2

# --- Nuestros eventos (teclas negras) ---
#mosquito     = Do#
#ovejas       = Re#
#xeremiers    = Fa#
#bronca       = Sol#

# --- Paisaje (octava libre: teclas blancas) ---
#tractor      = Sol
#cerdo        = Fa2
#pajaros      = Mi
#gusano       = Fa

